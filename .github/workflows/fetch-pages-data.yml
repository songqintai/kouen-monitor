name: kouen-pages-data

on:
  schedule:
    # 毎時0分に実行（UTC基準。UTC 0分 = JST +9時間の毎時0分）
    - cron: "0 * * * *"
  workflow_dispatch: {}

# 抓取したデータをdocs/data/vacancy.jsonに書き戻すために必要
permissions:
  contents: write

# 同時実行で衝突しないよう、前回の実行が終わるまで待つ
concurrency:
  group: fetch-pages-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: 事前にリモートの最新を取り込む（push衝突防止）
        run: git pull --ff-only origin main

      - name: 空き状況を取得してdocs/data/vacancy.jsonに書き出す
        run: node scripts/fetchData.js

      - name: 更新されたJSONをコミット
        run: |
          git config user.name "kouen-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/vacancy.json
          git diff --quiet --cached || git commit -m "chore: update GitHub Pages vacancy data [skip ci]"
          git push
