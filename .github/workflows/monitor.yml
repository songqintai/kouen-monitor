name: kouen-facility-monitor
# 1回のサイトアクセスで「新規空き検知＋メール通知」と「GitHub Pages表示用データ」
# の両方を面倒みる（元々はscripts/fetchData.js用に別workflowを分けていたが、
# 同じデータを別々に取得する無駄と、2つのworkflowが同時にmainへpushして
# 競合するリスクがあったため統合した）。

on:
  schedule:
    # 15分おきに実行（UTC基準。GitHub Actionsの最短間隔は5分だが、対象サイトへの
    # アクセス頻度を考慮して15分にしている。高負荷時は数分遅延することがある）
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# 前回の実行が長引いた場合に次回と重なる可能性があるため、
# 前回が終わるまで次回を待たせる（同時実行による重複メール送信やpush衝突を防ぐ）
concurrency:
  group: kouen-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run monitor
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_MAIL_TO: ${{ secrets.ALERT_MAIL_TO }}
        run: node monitor.js

      - name: Commit snapshot, alerts log & GitHub Pages data
        run: |
          git config user.name "kouen-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshot.json data/alerts.log docs/data/vacancy.json || true
          git diff --quiet --cached || git commit -m "chore: update snapshot [skip ci]"
          # 手動pushやリモート側の変化とタイミングが重なってrejectされることが
          # あるため、事前にリモートの最新を取り込んでからpushする（最大3回リトライ）
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "push失敗、リトライします ($i/3)..."
            sleep 5
          done
